<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pays & Capitales</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e10;
    --surface: #18181c;
    --border: #2a2a30;
    --accent: #e8c84a;
    --accent2: #4a9ee8;
    --text: #f0ede6;
    --muted: #7a7a85;
    --correct: #4ae89a;
    --wrong: #e84a4a;
  }

- { box-sizing: border-box; margin: 0; padding: 0; }

body {
font-family: ‘IBM Plex Mono’, monospace;
background: var(–bg);
color: var(–text);
min-height: 100vh;
display: flex;
flex-direction: column;
}

header {
padding: 20px 24px 16px;
border-bottom: 1px solid var(–border);
display: flex;
align-items: baseline;
gap: 16px;
flex-wrap: wrap;
}

h1 {
font-family: ‘Playfair Display’, serif;
font-size: 1.5rem;
font-weight: 900;
letter-spacing: -0.03em;
color: var(–accent);
}

.subtitle {
font-size: 0.7rem;
color: var(–muted);
letter-spacing: 0.1em;
text-transform: uppercase;
}

.progress-bar {
height: 3px;
background: var(–border);
width: 100%;
}
.progress-fill {
height: 100%;
background: var(–accent);
transition: width 0.4s ease;
}

/* TABS */
.tabs {
display: flex;
gap: 0;
border-bottom: 1px solid var(–border);
padding: 0 24px;
}
.tab {
padding: 12px 20px;
font-family: ‘IBM Plex Mono’, monospace;
font-size: 0.72rem;
letter-spacing: 0.08em;
text-transform: uppercase;
cursor: pointer;
border: none;
background: none;
color: var(–muted);
border-bottom: 2px solid transparent;
transition: all 0.2s;
}
.tab.active {
color: var(–accent);
border-bottom-color: var(–accent);
}
.tab:hover { color: var(–text); }

/* REGION FILTER */
.region-bar {
display: flex;
gap: 8px;
padding: 12px 24px;
overflow-x: auto;
border-bottom: 1px solid var(–border);
scrollbar-width: none;
}
.region-btn {
padding: 5px 12px;
border-radius: 2px;
border: 1px solid var(–border);
background: none;
color: var(–muted);
font-family: ‘IBM Plex Mono’, monospace;
font-size: 0.65rem;
letter-spacing: 0.06em;
cursor: pointer;
white-space: nowrap;
transition: all 0.15s;
}
.region-btn.active {
background: var(–accent);
color: var(–bg);
border-color: var(–accent);
}

/* MAIN */
main {
flex: 1;
padding: 24px;
max-width: 700px;
margin: 0 auto;
width: 100%;
}

/* FLASHCARD */
.card-container {
perspective: 1000px;
margin-bottom: 24px;
}
.card {
position: relative;
width: 100%;
height: 200px;
transform-style: preserve-3d;
transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
cursor: pointer;
}
.card.flipped { transform: rotateY(180deg); }

.card-face {
position: absolute;
inset: 0;
backface-visibility: hidden;
-webkit-backface-visibility: hidden;
border: 1px solid var(–border);
border-radius: 4px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 24px;
gap: 12px;
}
.card-front { background: var(–surface); }
.card-back {
background: #14141a;
transform: rotateY(180deg);
border-color: var(–accent);
}

.card-flag { font-size: 3rem; line-height: 1; }
.card-label {
font-size: 0.6rem;
letter-spacing: 0.15em;
text-transform: uppercase;
color: var(–muted);
}
.card-main {
font-family: ‘Playfair Display’, serif;
font-size: 1.8rem;
font-weight: 700;
text-align: center;
}
.card-hint {
font-size: 0.65rem;
color: var(–muted);
letter-spacing: 0.08em;
}
.card-region-badge {
position: absolute;
top: 12px;
right: 14px;
font-size: 0.55rem;
letter-spacing: 0.1em;
text-transform: uppercase;
color: var(–muted);
background: var(–bg);
padding: 3px 7px;
border-radius: 2px;
}

/* NAV */
.card-nav {
display: flex;
align-items: center;
justify-content: space-between;
gap: 12px;
margin-bottom: 20px;
}
.nav-btn {
flex: 1;
padding: 10px;
background: var(–surface);
border: 1px solid var(–border);
color: var(–text);
font-family: ‘IBM Plex Mono’, monospace;
font-size: 0.75rem;
cursor: pointer;
border-radius: 3px;
transition: all 0.15s;
letter-spacing: 0.05em;
}
.nav-btn:hover { border-color: var(–accent); color: var(–accent); }
.counter {
font-size: 0.7rem;
color: var(–muted);
white-space: nowrap;
min-width: 60px;
text-align: center;
}

/* QUIZ */
.quiz-question {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 4px;
padding: 28px 24px;
text-align: center;
margin-bottom: 20px;
}
.quiz-flag { font-size: 3.5rem; margin-bottom: 8px; }
.quiz-country {
font-family: ‘Playfair Display’, serif;
font-size: 1.6rem;
font-weight: 700;
margin-bottom: 6px;
}
.quiz-prompt {
font-size: 0.65rem;
color: var(–muted);
letter-spacing: 0.12em;
text-transform: uppercase;
}

.options-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
margin-bottom: 20px;
}
.option-btn {
padding: 14px 12px;
background: var(–surface);
border: 1px solid var(–border);
border-radius: 3px;
color: var(–text);
font-family: ‘IBM Plex Mono’, monospace;
font-size: 0.8rem;
cursor: pointer;
transition: all 0.15s;
text-align: left;
line-height: 1.3;
}
.option-btn:hover:not(:disabled) { border-color: var(–accent2); color: var(–accent2); }
.option-btn.correct { border-color: var(–correct); color: var(–correct); background: #0a1f14; }
.option-btn.wrong { border-color: var(–wrong); color: var(–wrong); background: #1f0a0a; }
.option-btn:disabled { cursor: default; }

/* STATS */
.stats-row {
display: flex;
gap: 12px;
margin-bottom: 20px;
}
.stat-box {
flex: 1;
background: var(–surface);
border: 1px solid var(–border);
padding: 14px 12px;
border-radius: 3px;
text-align: center;
}
.stat-num {
font-family: ‘Playfair Display’, serif;
font-size: 1.8rem;
font-weight: 700;
line-height: 1;
margin-bottom: 4px;
}
.stat-label { font-size: 0.6rem; color: var(–muted); letter-spacing: 0.1em; text-transform: uppercase; }

/* LIST VIEW */
.list-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 8px;
}
@media (max-width: 480px) { .list-grid { grid-template-columns: 1fr; } .options-grid { grid-template-columns: 1fr; } }

.list-item {
display: flex;
align-items: center;
gap: 10px;
padding: 10px 12px;
background: var(–surface);
border: 1px solid var(–border);
border-radius: 3px;
font-size: 0.72rem;
}
.list-item-flag { font-size: 1.2rem; flex-shrink: 0; }
.list-item-info {}
.list-item-country { font-weight: 500; margin-bottom: 2px; }
.list-item-capital { color: var(–accent); font-size: 0.65rem; }

.search-input {
width: 100%;
padding: 10px 14px;
background: var(–surface);
border: 1px solid var(–border);
border-radius: 3px;
color: var(–text);
font-family: ‘IBM Plex Mono’, monospace;
font-size: 0.8rem;
margin-bottom: 14px;
outline: none;
}
.search-input:focus { border-color: var(–accent); }
.search-input::placeholder { color: var(–muted); }

.feedback {
text-align: center;
font-size: 0.75rem;
padding: 10px;
border-radius: 3px;
margin-bottom: 14px;
display: none;
}
.feedback.show { display: block; }
.feedback.correct { background: #0a1f14; color: var(–correct); border: 1px solid var(–correct); }
.feedback.wrong { background: #1f0a0a; color: var(–wrong); border: 1px solid var(–wrong); }

.section-title {
font-size: 0.6rem;
letter-spacing: 0.15em;
text-transform: uppercase;
color: var(–muted);
margin-bottom: 12px;
}

.empty { text-align: center; padding: 40px; color: var(–muted); font-size: 0.75rem; }
</style>

</head>
<body>

<header>
  <h1>Pays & Capitales</h1>
  <span class="subtitle">195 pays · Mémorisation</span>
  <div style="flex:1; min-width:120px;">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
  <span id="progressLabel" style="font-size:0.65rem; color:var(--muted); white-space:nowrap">0 / 0 vus</span>
</header>

<div class="tabs">
  <button class="tab active" onclick="setTab('flash')">Flashcards</button>
  <button class="tab" onclick="setTab('quiz')">Quiz</button>
  <button class="tab" onclick="setTab('list')">Liste</button>
</div>

<div class="region-bar" id="regionBar"></div>

<main id="mainContent"></main>

  // Océanie
  {name:"Australie", capital:"Canberra", flag:"🇦🇺", region:"Océanie"},
  {name:"Nouvelle-Zélande", capital:"Wellington", flag:"🇳🇿", region:"Océanie"},
  {name:"Papouasie-Nouvelle-Guinée", capital:"Port Moresby", flag:"🇵🇬", region:"Océanie"},
  {name:"Fidji", capital:"Suva", flag:"🇫🇯", region:"Océanie"},
  {name:"Vanuatu", capital:"Port-Vila", flag:"🇻🇺", region:"Océanie"},
  {name:"Samoa", capital:"Apia", flag:"🇼🇸", region:"Océanie"},
  {name:"Tonga", capital:"Nuku'alofa", flag:"🇹🇴", region:"Océanie"},
];

const REGIONS = ["Tous", "Europe", "Afrique", "Amériques", "Asie", "Océanie"];

let currentTab = 'flash';
let currentRegion = 'Tous';
let flashIndex = 0;
let isFlipped = false;
let seen = new Set();
let quizScore = 0;
let quizTotal = 0;
let currentQuiz = null;
let shuffled = [];
let quizDirection = 'pays→capitale';

function getFiltered() {
  if (currentRegion === 'Tous') return ALL_COUNTRIES;
  return ALL_COUNTRIES.filter(c => c.region === currentRegion);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['flash', 'quiz', 'list'][i] === tab);
  });
  if (tab === 'flash') initFlash();
  else if (tab === 'quiz') initQuiz();
  else renderList();
}

function setRegion(r) {
  currentRegion = r;
  document.querySelectorAll('.region-btn').forEach(b => b.classList.toggle('active', b.dataset.r === r));
  flashIndex = 0; isFlipped = false; seen = new Set(); shuffled = [];
  quizScore = 0; quizTotal = 0;
  if (currentTab === 'flash') initFlash();
  else if (currentTab === 'quiz') initQuiz();
  else renderList();
  updateProgress();
}

function updateProgress() {
  const total = getFiltered().length;
  const pct = total > 0 ? Math.round((seen.size / total) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${seen.size} / ${total} vus`;
}

// FLASH
function initFlash() {
  const filtered = getFiltered();
  if (shuffled.length === 0 || shuffled[0].region !== filtered[0]?.region) {
    shuffled = shuffle(filtered);
    flashIndex = 0;
  }
  isFlipped = false;
  renderFlash();
}

function renderFlash() {
  const list = shuffled.length > 0 ? shuffled : shuffle(getFiltered());
  if (list.length === 0) { document.getElementById('mainContent').innerHTML = '<div class="empty">Aucun pays dans cette région.</div>'; return; }
  if (flashIndex >= list.length) flashIndex = 0;
  const c = list[flashIndex];
  seen.add(c.name);
  updateProgress();

  document.getElementById('mainContent').innerHTML = `
    <div class="stats-row">
      <div class="stat-box"><div class="stat-num" style="color:var(--accent)">${seen.size}</div><div class="stat-label">Vus</div></div>
      <div class="stat-box"><div class="stat-num">${list.length}</div><div class="stat-label">Total</div></div>
      <div class="stat-box"><div class="stat-num" style="color:var(--accent2)">${flashIndex + 1}</div><div class="stat-label">Position</div></div>
    </div>
    <div class="card-container">
      <div class="card ${isFlipped ? 'flipped' : ''}" id="flashCard" onclick="flipCard()">
        <div class="card-face card-front">
          <span class="card-region-badge">${c.region}</span>
          <span class="card-flag">${c.flag}</span>
          <span class="card-label">Pays</span>
          <span class="card-main">${c.name}</span>
          <span class="card-hint">Cliquer pour révéler la capitale →</span>
        </div>
        <div class="card-face card-back">
          <span class="card-flag">${c.flag}</span>
          <span class="card-label">Capitale de ${c.name}</span>
          <span class="card-main" style="color:var(--accent)">${c.capital}</span>
        </div>
      </div>
    </div>
    <div class="card-nav">
      <button class="nav-btn" onclick="prevCard()">← Précédent</button>
      <span class="counter">${flashIndex + 1} / ${list.length}</span>
      <button class="nav-btn" onclick="nextCard()">Suivant →</button>
    </div>
    <button class="nav-btn" onclick="shuffleCards()" style="width:100%; margin-top:4px">↺ Mélanger</button>
  `;
  shuffled = list;
}

function flipCard() { isFlipped = !isFlipped; const c = document.getElementById('flashCard'); if(c) c.classList.toggle('flipped', isFlipped); }
function nextCard() { flashIndex = (flashIndex + 1) % shuffled.length; isFlipped = false; renderFlash(); }
function prevCard() { flashIndex = (flashIndex - 1 + shuffled.length) % shuffled.length; isFlipped = false; renderFlash(); }
function shuffleCards() { shuffled = shuffle(getFiltered()); flashIndex = 0; isFlipped = false; renderFlash(); }

// QUIZ
function initQuiz() {
  currentQuiz = buildQuizQuestion();
  renderQuiz();
}

function buildQuizQuestion() {
  const filtered = getFiltered();
  if (filtered.length < 4) return null;
  const correct = filtered[Math.floor(Math.random() * filtered.length)];
  const wrongs = shuffle(filtered.filter(c => c.name !== correct.name)).slice(0, 3);
  const allOpts = shuffle([correct, ...wrongs]);
  return { correct, options: allOpts, answered: false, direction: Math.random() > 0.5 ? 'pays→capitale' : 'capitale→pays' };
}

function renderQuiz() {
  const q = currentQuiz;
  if (!q) { document.getElementById('mainContent').innerHTML = '<div class="empty">Pas assez de pays pour ce quiz.</div>'; return; }

  const questionText = q.direction === 'pays→capitale'
    ? `Quelle est la capitale de <strong>${q.correct.name}</strong> ?`
    : `${q.correct.capital} est la capitale de quel pays ?`;

  const optionLabels = q.direction === 'pays→capitale'
    ? q.options.map(o => o.capital)
    : q.options.map(o => o.name);

  const correctAnswer = q.direction === 'pays→capitale' ? q.correct.capital : q.correct.name;

  document.getElementById('mainContent').innerHTML = `
    <div class="stats-row">
      <div class="stat-box"><div class="stat-num" style="color:var(--correct)">${quizScore}</div><div class="stat-label">Corrects</div></div>
      <div class="stat-box"><div class="stat-num">${quizTotal}</div><div class="stat-label">Tentatives</div></div>
      <div class="stat-box"><div class="stat-num" style="color:var(--accent)">${quizTotal > 0 ? Math.round(quizScore/quizTotal*100) : 0}%</div><div class="stat-label">Score</div></div>
    </div>
    <div class="quiz-question">
      <div class="quiz-flag">${q.correct.flag}</div>
      <div class="quiz-prompt">${questionText}</div>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="options-grid" id="optionsGrid">
      ${q.options.map((o, i) => {
        const label = q.direction === 'pays→capitale' ? o.capital : o.name;
        return `<button class="option-btn" onclick="answerQuiz(this, '${label.replace(/'/g, "\\'")}', '${correctAnswer.replace(/'/g, "\\'")}', '${q.correct.name}')">${label}</button>`;
      }).join('')}
    </div>
    <button class="nav-btn" id="nextQuizBtn" onclick="nextQuiz()" style="width:100%; display:none; margin-top:4px">Question suivante →</button>
  `;
}

function answerQuiz(btn, chosen, correct, countryName) {
  if (currentQuiz.answered) return;
  currentQuiz.answered = true;
  quizTotal++;
  const isRight = chosen === correct;
  if (isRight) quizScore++;

  document.querySelectorAll('.option-btn').forEach(b => {
    b.disabled = true;
    const label = b.textContent.trim();
    if (label === correct) b.classList.add('correct');
    else if (b === btn && !isRight) b.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (isRight ? 'correct' : 'wrong');
  fb.textContent = isRight ? `✓ Correct ! ${countryName} → ${correct}` : `✗ Non. La bonne réponse : ${correct}`;
  document.getElementById('nextQuizBtn').style.display = 'block';
  document.getElementById('mainContent').querySelectorAll('.stat-num')[0].textContent = quizScore;
  document.getElementById('mainContent').querySelectorAll('.stat-num')[1].textContent = quizTotal;
  document.getElementById('mainContent').querySelectorAll('.stat-num')[2].textContent = Math.round(quizScore/quizTotal*100) + '%';
}

function nextQuiz() {
  currentQuiz = buildQuizQuestion();
  renderQuiz();
}

// LIST
function renderList() {
  const filtered = getFiltered();
  const searchVal = document.getElementById('listSearch')?.value.toLowerCase() || '';
  const display = searchVal ? filtered.filter(c =>
    c.name.toLowerCase().includes(searchVal) || c.capital.toLowerCase().includes(searchVal)
  ) : filtered;

  document.getElementById('mainContent').innerHTML = `
    <p class="section-title">${display.length} pays · Cliquer pour copier</p>
    <input type="text" class="search-input" id="listSearch" placeholder="Rechercher un pays ou une capitale…" value="${searchVal}" oninput="renderList()">
    <div class="list-grid">
      ${display.map(c => `
        <div class="list-item">
          <span class="list-item-flag">${c.flag}</span>
          <div class="list-item-info">
            <div class="list-item-country">${c.name}</div>
            <div class="list-item-capital">${c.capital}</div>
          </div>
        </div>
      `).join('')}
    </div>
    ${display.length === 0 ? '<div class="empty">Aucun résultat.</div>' : ''}
  `;
}

// INIT
function init() {
  // Region bar
  const bar = document.getElementById('regionBar');
  bar.innerHTML = REGIONS.map(r => `<button class="region-btn ${r === currentRegion ? 'active' : ''}" data-r="${r}" onclick="setRegion('${r}')">${r}</button>`).join('');

  shuffled = shuffle(getFiltered());
  initFlash();
}

init();
</script>

</body>
</html>
